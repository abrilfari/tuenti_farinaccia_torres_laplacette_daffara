<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evaluación UX — Leyes UX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">Evaluación UX</span>
    <span class="brand-tag">Tablero 1</span>
  </div>
  <nav>
    <a href="index.html">Índice</a>
    <a href="leyes-ux.html" class="active">Leyes UX</a>
    <a href="heuristica.html">Heurísticas</a>
  </nav>
</header>

<main class="wrap">
  <div class="intro">
    <h1>Leyes UX — Checklist de navegación</h1>
    <p class="lede">Nombre del producto evaluado: <strong>Tuenti</strong>. Recorrido analizado: <strong>[ej. onboarding → búsqueda → checkout]</strong></p>
  </div>

  <div class="stats" id="stats"></div>

  <div class="filters" id="filters">
    <button data-filter="all" class="active">Todas</button>
    <button data-filter="cumple">Cumple</button>
    <button data-filter="rompe">Rompe</button>
    <button data-filter="pendiente">Pendiente</button>
  </div>

  <div class="entries" id="entries"></div>
        <footer class="dev-note"> Renata Daffara, Abril Farinaccia, Yazmin Laplacette, Benjamin Torres </footer>
</main>

<script>
// Cada objeto = una ley. status: "cumple" | "rompe" | "pendiente"
// img: ruta a la captura (ej. "assets/screenshots-leyes/01-jakob.png") o null para dejar el placeholder.
const leyes = [
  { nombre:"Ley de Jakob", sub:"Consistencia con patrones conocidos", status:"cumple",
    pregunta:"¿La interfaz se comporta como el usuario espera, basado en otras apps que ya conoce?",
    img:"assets/IMG_9354.PNG", analisis:"Tuenti utiliza patrones habituales de las aplicaciones móviles: flechas para volver, listas de opciones, iconos acompañados por texto y secciones claramente tituladas. Es decir, la aplicación sigue convenciones conocidas de navegación móvil, por lo que una persona acostumbrada a utilizar otras apps no necesita aprender patrones completamente nuevos." },

  { nombre:"Ley de Fitts", sub:"Tamaño y distancia de los objetivos táctiles", status:"cumple",
    pregunta:"¿Los elementos clave son fáciles de alcanzar y seleccionar (tamaño, ubicación, espaciado)?",
    img:"assets/IMG_9324.PNG", analisis:"Sí.Las acciones principales tienen áreas de interacción amplias y están ubicadas directamente en la pantalla principal. Aparecen botones grandes y fácilmente alcanzables como: Compra de Gigas y Recarga automática. Al tratarse de acciones frecuentes, su tamaño y ubicación facilitan la interacción desde un dispositivo móvil." },

  { nombre:"Ley de Hick", sub:"Cantidad de opciones vs. tiempo de decisión", status:"rompe",
    pregunta:"¿La cantidad de opciones presentadas a la vez ayuda o entorpece la decisión del usuario?",
    img:"assets/IMG_9354.PNG", analisis:" La cantidad de opciones disponibles puede aumentar el tiempo de decisión, especialmente cuando la persona busca una función específica dentro del perfil. En determinadas pantallas Tuenti presenta varias alternativas simultáneamente. Por ejemplo, en Perfil aparecen Información Personal, Mensajes Tuenti, Gestión de notificaciones, Condiciones de uso y Cerrar sesión." },

  { nombre:"Ley de Miller", sub:"Límite de la memoria de trabajo (7±2)", status:"rompe",
    pregunta:"¿La información se agrupa en bloques manejables o satura la memoria de corto plazo?",
    img:"assets/IMG_9362.JPEG", analisis:" La información está agrupada por secciones, pero algunas pantallas contienen varios elementos que requieren ser procesados simultáneamente. Una organización aún más reducida podría disminuir la carga cognitiva." },

  { nombre:"Ley de Tesler", sub:"Conservación de la complejidad", status:"rompe",
    pregunta:"¿La complejidad inevitable de la tarea la absorbe el sistema o se la traslada al usuario?",
    img:"assets/IMG_9332.PNG", analisis:" Parte de la complejidad de la recarga queda en manos del usuario, que debe comparar opciones, precios, cantidad de gigas y duración antes de seleccionar una alternativa." },

  { nombre:"Ley de estética-usabilidad", sub:"Diseño atractivo percibido como más usable", status:"cumple",
    pregunta:"¿Un diseño visualmente cuidado hace que se perciban menos problemas de usabilidad reales?",
    img:"assets/IMG_9325.PNG", analisis:" La estética consistente de Tuenti favorece la percepción de una experiencia simple, aunque esto no garantiza que todos los flujos sean igualmente fáciles." }, 

  { nombre:"Efecto Von Restorff", sub:"El elemento distinto se recuerda más", status:"cumple",
    pregunta:"¿La acción principal se distingue visualmente del resto para no perderse entre las demás opciones?",
    img:"assets/IMG_9325.PNG", analisis:" La acción principal del banner se diferencia mediante contraste de color, tamaño y ubicación, por lo que atrae rápidamente la atención de la persona usuaria." },
    
    { nombre:"Navaja de Occam", sub:"La solución más simple suele ser la mejor", status:"rompe", pregunta:"¿La pantalla de inicio elimina elementos innecesarios para reducir la complejidad sin perder funcionalidad?", img:null, analisis:"La pantalla de inicio sobrecarga la interfaz al mezclar en un mismo flujo vertical el saldo disponible, el consumo de datos, accesos a servicios y múltiples banners promocionales. En lugar de ofrecer la opción visual más directa para consultar el estado de la línea o recargar, añade ruido innecesario con tarjetas promocionales competir por la atención del usuario." }, 
    
    { nombre:"Principio de Pareto", sub:"Regla del 80/20", status:"cumple", pregunta:"¿El 80% de los usuarios puede realizar las tareas más frecuentes con el 20% de la interfaz más accesible?", img:"assets/IMG_9324.PNG", analisis:"Las acciones que representan la inmensa mayoría de las interacciones diarias (consultar gigas restantes, comprar combos y recargar saldo) se concentran en la parte superior y en accesos directos destacados de la pantalla principal, permitiendo resolver las tareas esenciales sin necesidad de navegar por menús secundarios." },
];

const entriesEl = document.getElementById('entries');
const statsEl = document.getElementById('stats');

function render(filter='all'){
  entriesEl.innerHTML = '';
  leyes.forEach((l, i) => {
    if(filter !== 'all' && l.status !== filter) return;
    const el = document.createElement('div');
    el.className = `entry ${l.status}`;
    el.innerHTML = `
      <div class="head">
        <div>
          <span class="num">${String(i+1).padStart(2,'0')}</span><h2>${l.nombre}</h2>
          <div class="sub">${l.sub}</div>
        </div>
        <span class="tag ${l.status}">${l.status === 'pendiente' ? 'Pendiente' : (l.status === 'cumple' ? 'Cumple' : 'Rompe')}</span>
      </div>
      <div class="question">${l.pregunta}</div>
      <div class="evidence">
        <div class="shot ${l.img ? 'has-img' : ''}">${l.img ? `<img src="${l.img}" alt="Captura — ${l.nombre}">` : 'Falta la captura<br>reemplazar en el array `leyes`'}</div>
        <div class="analysis">
          <p class="${l.analisis ? '' : 'fill'}">${l.analisis || 'Completar: qué se observa y por qué cumple o rompe la ley (1–2 frases).'}</p>
        </div>
      </div>`;
    entriesEl.appendChild(el);
  });
}

function renderStats(){
  const total = leyes.length;
  const cumple = leyes.filter(l=>l.status==='cumple').length;
  const rompe = leyes.filter(l=>l.status==='rompe').length;
  const pendiente = leyes.filter(l=>l.status==='pendiente').length;
  statsEl.innerHTML = `
    <div class="stat"><div class="num">${total}</div><div class="label">Leyes en checklist</div></div>
    <div class="stat"><div class="num">${cumple}</div><div class="label">Cumplen</div></div>
    <div class="stat"><div class="num">${rompe}</div><div class="label">Se rompen</div></div>
    <div class="stat"><div class="num">${pendiente}</div><div class="label">Pendientes</div></div>`;
}

document.getElementById('filters').addEventListener('click', (e)=>{
  if(e.target.tagName !== 'BUTTON') return;
  document.querySelectorAll('#filters button').forEach(b=>b.classList.remove('active'));
  e.target.classList.add('active');
  render(e.target.dataset.filter);
});

render();
renderStats();
</script>
</body>
</html>
